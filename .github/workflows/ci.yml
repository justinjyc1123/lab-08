name: Android CI

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: '30438e94d7865eb62a3aeca1b77a5990f688a8cf'
        required: true
        default: 'main'
        type: string
  push:
    branches: [main, master, "**"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.test_ref || github.sha }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./lab8

      - name: Build and test with Gradle
        run: ./gradlew build --configuration-cache
        working-directory: ./lab8
